abstract: >+
  We introduce `dsFedAte` and `dsFedAteClient`, two companion R packages for
  federated estimation of the average treatment effect (ATE) from multiple
  randomized controlled trials (RCTs), without sharing individual-level data.
  Built on the open-source DataSHIELD privacy-preserving infrastructure, they
  implement a covariate-adjusted G-formula estimator accommodating heterogeneous
  covariate distributions and study effects. Unlike iterative federated
  optimization methods, our approach fits arm-specific linear outcome models in
  a single communication round by aggregating local sufficient statistics,
  yielding estimates identical to those obtained from centrally pooled data.
  The entire analysis is accessible through a single client-side function,
  `ds.EstimateAte()`.

  Beyond implementation, we also present methodological contributions. First,
  we derive the asymptotic variance of the ATE estimator, accounting for
  heterogeneous covariate distributions and study effects, and express its
  estimator in terms of locally aggregable quantities, enabling federated
  confidence intervals equivalent to those obtained from pooled data. Second,
  we establish consistency and asymptotic normality under misspecified linear
  outcome models, showing that covariate adjustment is asymptotically at least
  as efficient as the unadjusted stratified difference-in-means estimator.

  We illustrate the packages through reproducible examples using the DSLite
  simulation environment, covering homogeneous and heterogeneous populations,
  DataSHIELD disclosure controls, and adjustment for study effects. A simulation
  study validates the theoretical results and demonstrates nominal confidence
  interval coverage.

keywords: [federated learning, causal inference, average treatment effect, DataSHIELD, R package, privacy-preserving statistics, multi-site RCT]
